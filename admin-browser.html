<!doctype html>
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHS Lost & Found</title>
    <link rel="stylesheet" href="global-styles.css">
    <link rel="stylesheet" href="admin-browser-styles.css">
  </head>
  <body>
    <main>
      <!--Admin Browser Header - Contains listing filters, clicking on them triggers js to only show certain listings-->

      <header>
        <span class="filters-title"><h1>Filters</h1></span>
        <div class="filters">
          <a href="/">Posted</a>
          <a href="/">Unposted</a>
          <a href="/">Claims</a>
        </div>
      </header>
      <!--Main Body - Contains listing divs, dynamically updated through js-->
      <div class="listing-container">
        <img src="images/lunchbox.webp"
        alt="Image of the item."
        width="200"
        height="200"
        >
        <span><h2>Item Description</h2></span>
        <span><h2>Posted x/x/x By: John Smith</h2></span>
        <span><h2><a href="/">Tap to View</a></h2></span>
      </div>
      <div class="listing-container">
        <img src="images/owala.webp"
        alt="Image of the item."
        width="200"
        height="200"
        >
        <h2>Item Description</h2>
        <h2>Posted x/x/x By: John Smith</h2>
        <h2><a href="/">Tap to View</a></h2>
      </div>
      <div class="listing-container">
        <img src="images/sweater.webp"
        alt="Image of the item."
        width="200"
        height="200"
        >
        <h2>Item Description</h2>
        <h2>Posted x/x/x By: John Smith</h2>
        <h2><a href="/">Tap to View</a></h2>
      </div>
      <div class="listing-container">
        <img src="images/hat.jpg"
        alt="Image of the item."
        width="200"
        height="200"
        >
        <h2>Item Description</h2>
        <h2>Posted x/x/x By: John Smith</h2>
        <h2><a href="/">Tap to View</a></h2>
      </div>
      <!--End of Main Browser-->
      <!--Footer - Contains SDM Link, Website Title, Menu Button-->
      <footer>
        <p>
          <a href="https://www.milton.k12.wi.us/">
            <img
              src="images/red_hawks_logo.webp"
              alt="Milton School District website link."
              width="50"
              height="50"
            />
          </a>
        </p>
        <p>MHS Lost & Found</p>
        <a href="#">Menu</a>
      </footer>
      <!--End of Footer-->
    </main>
  </body>
