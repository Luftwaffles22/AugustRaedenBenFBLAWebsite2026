<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHS Lost & Found</title>
    <link rel="stylesheet" href="stylesheets/global-styles.css">
    <link rel="stylesheet" href="stylesheets/student-item-listing-styles.css">
  </head>
  <body>
    <main>
      <!--Image Scroller div - Contains all images of the item, and allows the user to scroll through them (using L and R buttons CSS'd to arrows)-->
      <div class="image-scroller">
        <button class="arrow-button-right">R</button>
        <img src="/" alt="An image of the listed item.">
        <button class="arrow-button-left">L</button>
      </div>
      <!--End of Image Scroller Div-->

      <!--Item Information: Posted By Who? When? What is it?-->
      <p>Item Description</p>
      <p>Posted: x/x/x By: John Smith</p>
      <!--End of Info-->

      <!--Claim button for Student View-->
      <button class="student-claim-button">Claim Item</button>

      <!--Footer - Contains SDM Link, Website Title, Menu Button-->
      <footer>
        <p>
          <a href="https://www.milton.k12.wi.us/">
            <img
              src="images/red_hawks_logo.webp"
              alt="Milton School District website link."
              width="50"
              height="50"
            />
          </a>
        </p>
        <p>MHS Lost & Found</p>
        <a href="#">Menu</a>
      </footer>
      <!--End of Footer-->
      
    </main>
  </body>
