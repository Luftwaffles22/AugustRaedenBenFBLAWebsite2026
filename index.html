<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHS Lost & Found</title>
    <link rel="stylesheet" href="stylesheets/global-styles.css">
    <link rel="stylesheet" href="stylesheets/index-styles.css">
  </head>
  <body>
    <main>
      <!--Homepage Header - Contains Login Button -->
      <header>
        <div class="popup">
          <p onclick="loginpopup()">LOGIN</p>
          <span class="popuptext" id="myPopup">
            Input ID
            <input id="loginpin" type="text">
            <p onclick="checkpin()" id="enterbutton">Enter</p>
          </span>  
        </div>
        <script>
          function loginpopup() {
            var popup = document.getElementById("myPopup");
            popup.classList.toggle("show");
          }
        </script>
      </header>
      <!--End of Header - Start of Info Boxes-->

      <!--Info Boxes - Contain 1 text box and 1 image, to display items found with our website-->
      <div class="found-item-post">
        <img
          id="images"
          src="images/owala.webp"
          alt="Someone's lost water bottle which was found by an MHS student."
          width="200"
          height="200"
        />
        <p>This is a text box.</p>
      </div>
      <!--Reversed Info Box - Must be reversed to follow common reading paths-->
      <div class="found-item-post found-item-post-rev">
        <img
          id="images"
          src="images/lunchbox.webp"
          alt="Someone's lost lunchbox which was found by an MHS student."
          width="200"
          height="200"
        />
      </div>

      <div class="found-item-post">
        <img
          id="images"
          src="images/sweater.webp"
          alt="Someone's lost sweater which was found by an MHS student."
          width="200"
          height="200"
        />
        <p>This is a text box.</p>
      </div>
      <!--End of Info Boxes - Start of Footer-->
      <!--Footer - Contains SDM Link, Website Title, Menu Button-->
      <footer>
        <p>
          <a href="https://www.milton.k12.wi.us/">
            <img
            id="logo"
              src="images/red_hawks_logo.webp"
              alt="Milton School District website link."
              width="50"
              height="50"
            />
          </a>
        </p>
        <p>MHS Lost & Found</p>
        <a href="#">Menu</a>
      </footer>
      <!--End of Footer-->
    </main>
  </body>
</html>
